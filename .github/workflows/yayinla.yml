name: Instagram yayin

on:
  schedule:
    # Her saat basi istenir (UTC); GitHub pratikte 2-8 saatte bir calistiriyor.
    # Zamani 5,5 saat icinde gelecek post varsa calisma o saate kadar bekler (yayinci.py, BEKLEME_UFKU).
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    # Bekleme (330 dk) + yayin. Siniri asarsa is iptal olur, post bir sonraki calismaya kalir.
    timeout-minutes: 350
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yayinciyi calistir
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python yayinci.py

      - name: Tazelenen token'i Secret'a yaz
        # Bu adim yalnizca GH_PAT secret'i tanimliysa calisir.
        # PAT yoksa atlanir; token 60 gunde bir elle yenilenir.
        if: always() && hashFiles('yeni_token.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT yok, token Secret'a yazilamadi."
          else
            gh secret set IG_ACCESS_TOKEN --body "$(cat yeni_token.txt)" --repo "${{ github.repository }}"
            echo "IG_ACCESS_TOKEN guncellendi."
          fi
          rm -f yeni_token.txt

      - name: Kuyruk ve gunlugu isle
        if: always()
        run: |
          rm -f yeni_token.txt
          if [ -n "$(git status --porcelain kuyruk.json gunluk.md token_tazeleme.txt)" ]; then
            git config user.name "yayin-botu"
            git config user.email "actions@github.com"
            git add kuyruk.json gunluk.md token_tazeleme.txt
            git commit -m "yayin: kuyruk guncellendi"
            # Calisma sirasinda depoya baska degisiklik geldiyse ustune ekle; push reddedilirse
            # "yayinlandi" bilgisi kaybolur ve post bir sonraki calismada TEKRAR yayinlanir.
            # Rebase catisirsa (kuyruk.json ayni anda duzenlendi) sonuclar id'ye gore tasinir.
            for deneme in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME"; then
                git push && exit 0
              else
                git rebase --abort || true
                python kuyruk_birlestir.py "$GITHUB_REF_NAME"
                git push && exit 0
              fi
              sleep 5
            done
            echo "!! Kuyruk depoya yazilamadi - yayinlanan postlar tekrar yayinlanabilir, kuyruk.json'u elle kontrol et."
            exit 1
          else
            echo "Degisiklik yok."
          fi
